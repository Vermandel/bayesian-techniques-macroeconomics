      handout: {type: PDF, url: https://github.com/Vermandel/bayesian-techniques-macroeconomics/blob/main/handouts/session1-modern-business-cycle-theory.pdf}
      slides: {type: PDF, url: https://github.com/Vermandel/bayesian-techniques-macroeconomics/blob/main/slides/session1-modern-business-cycle-theory.pdf}
      code: {type: MATLAB, url: https://github.com/Vermandel/bayesian-techniques-macroeconomics/tree/main/code/session1}
    - title: A Production Economy
      handout: {type: PDF, url: https://github.com/Vermandel/bayesian-techniques-macroeconomics/blob/main/handouts/session2-production-economy.pdf}
      slides: {type: PDF, url: https://github.com/Vermandel/bayesian-techniques-macroeconomics/blob/main/slides/session2-production-economy.pdf}
      code: {type: Dynare, url: https://github.com/Vermandel/bayesian-techniques-macroeconomics/tree/main/code/session2}
    - title: Maximum Likelihood Estimation
      handout: {type: PDF, url: https://github.com/Vermandel/bayesian-techniques-macroeconomics/blob/main/handouts/session3-maximum-likelihood.pdf}
      slides: {type: PDF, url: https://github.com/Vermandel/bayesian-techniques-macroeconomics/blob/main/slides/session3-maximum-likelihood.pdf}
      code: {type: MATLAB, url: https://github.com/Vermandel/bayesian-techniques-macroeconomics/tree/main/code/session3}
    - title: Bayesian Estimation of DSGE Models
      handout: {type: PDF, url: https://github.com/Vermandel/bayesian-techniques-macroeconomics/blob/main/handouts/session4-bayesian-estimation.pdf}
      slides: {type: PDF, url: https://github.com/Vermandel/bayesian-techniques-macroeconomics/blob/main/slides/session4-bayesian-dsge.pdf}
      code: {type: Dynare, url: https://github.com/Vermandel/bayesian-techniques-macroeconomics/tree/main/code/session4}
  data:
