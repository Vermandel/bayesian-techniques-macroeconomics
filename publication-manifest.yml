schema: teaching-publication-manifest/v1
course:
  title: Bayesian Techniques in Macroeconomics
  academic_year: "2026-2027"
  short_description: >-
    Four-session course on business-cycle theory, likelihood-based estimation
    and Bayesian DSGE methods with MATLAB, Dynare and reproducible data.
  course_page: https://vermandel.org/btm/
  github_repository: https://github.com/Vermandel/bayesian-techniques-macroeconomics
  revision: main
  revision_note: "The publication handoff records the exact audited commit."
  illustration:
    preserve_existing_editorial_illustration: true
    placement: inline-right-on-desktop

schedule:
  sessions:
    - number: 1
      date: "2026-11-12"
      time: "08:30-11:45"
      title: Modern Business Cycle Theory
    - number: 2
      date: "2026-11-19"
      time: "08:30-11:45"
      title: A Production Economy
    - number: 3
      date: "2026-11-26"
      time: "08:30-11:45"
      title: Maximum Likelihood Estimation
    - number: 4
      date: "2026-12-03"
      time: "08:30-11:45"
      title: Bayesian Estimation of DSGE Models

assessment:
  mode: rendu_ecrit
  mode_label:
    fr: Rendu écrit
    en: Written submission
  deadline: "15 January 2027"
  summary: >-
    Choose one of four models. Submit an English report as a PDF produced from
    LaTeX, plus documented reproducible code, data provenance, transformations,
    estimation results and diagnostics.
  guide:
    label: Assessment guide
    type: GitHub
    url: https://github.com/Vermandel/bayesian-techniques-macroeconomics/tree/main/assessment
  models:
    - label: Credit market model
      type: PDF
      url: https://raw.githubusercontent.com/Vermandel/bayesian-techniques-macroeconomics/main/assessment/models/credit_market/credit_market_model.pdf
    - label: Mortgage model
      type: PDF
      url: https://raw.githubusercontent.com/Vermandel/bayesian-techniques-macroeconomics/main/assessment/models/mortgage/mortgage_market_model.pdf
    - label: Open-economy model
      type: PDF
      url: https://raw.githubusercontent.com/Vermandel/bayesian-techniques-macroeconomics/main/assessment/models/open_economy/two_countries.pdf
    - label: Unemployment model
      type: PDF
      url: https://raw.githubusercontent.com/Vermandel/bayesian-techniques-macroeconomics/main/assessment/models/unemployment/unemployment.pdf

resources:
  syllabus:
    label: Syllabus 2026-2027
    type: PDF
    url: https://raw.githubusercontent.com/Vermandel/bayesian-techniques-macroeconomics/main/syllabus/btm-syllabus-2026-2027.pdf
  sessions:
    - title: Modern Business Cycle Theory
      handout: {type: PDF, url: https://raw.githubusercontent.com/Vermandel/bayesian-techniques-macroeconomics/main/session1/handout1.pdf}
      slides: {type: PDF, url: https://raw.githubusercontent.com/Vermandel/bayesian-techniques-macroeconomics/main/session1/slides1.pdf}
      code: {type: MATLAB, url: https://github.com/Vermandel/bayesian-techniques-macroeconomics/tree/main/session1/codes/}
      code_display_files: ["BSmeasures.m", "bpass.m", "download_data.m", "dyn_toy_model.mod", "logGDP.m", "toy_model.m", "toy_model_bootstrap.m"]
      code_display_exclude: ["call_dbnomics.m", "example_single_series.m", "example_multiple_countries.m", "example_multiple_series.m", "example_plot_inflation.m"]
      code_display_note: "Use this explicit display list, not directory enumeration. DBnomics generic examples belong to software.DBnomics; keep local helper dependencies."
    - title: A Production Economy
      handout: {type: PDF, url: https://raw.githubusercontent.com/Vermandel/bayesian-techniques-macroeconomics/main/session2/handout2.pdf}
      slides: {type: PDF, url: https://raw.githubusercontent.com/Vermandel/bayesian-techniques-macroeconomics/main/session2/slides2.pdf}
      code: {type: Dynare, url: https://github.com/Vermandel/bayesian-techniques-macroeconomics/tree/main/session2/codes/}
    - title: Maximum Likelihood Estimation
      handout: {type: PDF, url: https://raw.githubusercontent.com/Vermandel/bayesian-techniques-macroeconomics/main/session3/handout3.pdf}
      slides: {type: PDF, url: https://raw.githubusercontent.com/Vermandel/bayesian-techniques-macroeconomics/main/session3/slides3.pdf}
      code: {type: MATLAB, url: https://github.com/Vermandel/bayesian-techniques-macroeconomics/tree/main/session3/codes/}
    - title: Bayesian Estimation of DSGE Models
      handout: {type: PDF, url: https://raw.githubusercontent.com/Vermandel/bayesian-techniques-macroeconomics/main/session4/handout4.pdf}
      slides: {type: PDF, url: https://raw.githubusercontent.com/Vermandel/bayesian-techniques-macroeconomics/main/session4/slides4.pdf}
      code: {type: Dynare, url: https://github.com/Vermandel/bayesian-techniques-macroeconomics/tree/main/session4/codes/}
  data:
    label: Course data downloader
    type: Data
    url: https://github.com/Vermandel/bayesian-techniques-macroeconomics/blob/main/session1/codes/download_data.m
  github:
    label: Course repository
    type: GitHub
    url: https://github.com/Vermandel/bayesian-techniques-macroeconomics

software:
  - name: MATLAB
    type: MATLAB
    text: Use a current MATLAB release compatible with Dynare.
    url: https://www.mathworks.com/products/matlab.html
  - name: Dynare
    type: Dynare
    text: Use a Dynare release compatible with the installed MATLAB version.
    url: https://www.dynare.org/
  - name: DBnomics
    type: Data
    text: DBnomics is the canonical source for general macroeconomic data retrieval guidance.
    repository: https://github.com/Vermandel/dbnomics-teaching
    guide_pdf: https://raw.githubusercontent.com/Vermandel/dbnomics-teaching/d0a59bf337b63e8000c707ab129e557fd629eb70/guide/call_dbnomics-guide.pdf
    repository_commit: d0a59bf337b63e8000c707ab129e557fd629eb70
    publication_manifest: https://raw.githubusercontent.com/Vermandel/dbnomics-teaching/11be5376054a8e776f5cd0273682d3dc3868b20f/publication-manifest.json
    downloads:
      - {label: call_dbnomics.m, type: MATLAB, url: https://raw.githubusercontent.com/Vermandel/dbnomics-teaching/1ff66c0c5d96b06556e5c0a202877cdc4a117d74/code/call_dbnomics.m}
      - {label: example_single_series.m, type: MATLAB, url: https://raw.githubusercontent.com/Vermandel/dbnomics-teaching/1ff66c0c5d96b06556e5c0a202877cdc4a117d74/examples/example_single_series.m}
      - {label: example_multiple_countries.m, type: MATLAB, url: https://raw.githubusercontent.com/Vermandel/dbnomics-teaching/1ff66c0c5d96b06556e5c0a202877cdc4a117d74/examples/example_multiple_countries.m}
      - {label: example_multiple_series.m, type: MATLAB, url: https://raw.githubusercontent.com/Vermandel/dbnomics-teaching/1ff66c0c5d96b06556e5c0a202877cdc4a117d74/examples/example_multiple_series.m}
      - {label: example_plot_inflation.m, type: MATLAB, url: https://raw.githubusercontent.com/Vermandel/dbnomics-teaching/1ff66c0c5d96b06556e5c0a202877cdc4a117d74/examples/example_plot_inflation.m}
      - {label: example_plot_datetime.m, type: MATLAB, url: https://raw.githubusercontent.com/Vermandel/dbnomics-teaching/1ff66c0c5d96b06556e5c0a202877cdc4a117d74/examples/example_plot_datetime.m}
      - {label: example_plot_numeric.m, type: MATLAB, url: https://raw.githubusercontent.com/Vermandel/dbnomics-teaching/1ff66c0c5d96b06556e5c0a202877cdc4a117d74/examples/example_plot_numeric.m}
    status: ready

publication_policy:
  audience: students
  extended_slides: INSTRUCTOR_ONLY
  exclude_globs: ["**/*extended*.pdf", "archive/**", "private/**"]
  student_slides: compact_only
  dbnomics_generic_resources_section: software.DBnomics
  preserve_local_dependencies: true
  historical_git_objects: "Not purged; old immutable URLs can remain publicly accessible."
